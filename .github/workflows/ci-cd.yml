name: CI/CD Pipeline - Cohort Copilot

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  PROJECT_ID: whatsapp-agent-507202
  GAR_LOCATION: us-central1
  REPOSITORY: cohort-copilot-repo
  IMAGE: copilot-backend
  SERVICE: cohort-copilot-backend
  REGION: us-central1

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify critical imports (catches missing packages on VM)
        run: |
          python -c "
          import psycopg, pgvector, fastapi, langgraph, langchain_openai, chromadb
          print('✅ All critical packages importable')
          "

      - name: Run Pytest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || 'sk-or-test-key-placeholder' }}
          DATABASE_URL: "postgresql://dummy:dummy@localhost/dummy"
          COHORT_1_GROUP_ID: "120363428812662381@g.us"
          COHORT_2_GROUP_ID: "120363406407748018@g.us"
        run: |
          pytest tests/ -v --tb=short

      - name: Check Axios timeout >= 30s in bridge/index.js
        run: |
          python - <<'EOF'
          import re
          from pathlib import Path
          js = Path("bridge/index.js").read_text()
          # Only check axios.post timeouts — the 3000ms health probe GET is intentional
          post_timeouts = [int(x) for x in re.findall(r"axios\.post\([^)]*timeout:\s*(\d+)", js, re.DOTALL)]
          low = [t for t in post_timeouts if t < 30000]
          if low:
              print(f"❌ axios.post timeout(s) too low: {low}ms — must be >= 30000ms")
              exit(1)
          print(f"✅ All axios.post timeouts OK: {post_timeouts}ms")
          EOF

      - name: Verify PREFECT_JID env var is used in bridge/index.js
        run: |
          grep -q "process.env.PREFECT_JID" bridge/index.js && \
            echo "✅ PREFECT_JID env var correctly used" || \
            (echo "❌ bridge/index.js must use process.env.PREFECT_JID for VIP alerts" && exit 1)

  deploy:
    name: Build & Deploy to Cloud Run
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Build & Tag Container Image
        run: |
          docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }} .

      - name: Push Container to Artifact Registry
        run: |
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to Google Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
          env_vars: |
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            OPENROUTER_MODEL=google/gemini-2.5-flash
            COHORT_1_GROUP_ID=${{ secrets.COHORT_1_GROUP_ID }}
            COHORT_2_GROUP_ID=${{ secrets.COHORT_2_GROUP_ID }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
          flags: '--allow-unauthenticated --min-instances=0 --memory=512Mi --cpu=1'

  # ============================================================
  # JOB 3 — Deploy bridge + backend to GCP VM via SSH
  # ============================================================
  deploy-vm:
    name: 🚀 Deploy to GCP VM
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Pull & restart on VM (Errors #6, #11)
        run: |
          gcloud compute ssh abami@whatsapp-bridge-vm \
            --zone=us-central1-a \
            --project=whatsapp-agent-507202 \
            --command="
              cd /home/abami/Whatsapp-Agent &&
              git fetch origin main &&
              git checkout origin/main -- bridge/index.js src/api.py src/config.py src/cohorts.py 2>/dev/null || true &&
              git pull origin main &&
              venv/bin/pip install -r requirements.txt --quiet &&
              pm2 restart whatsapp-bridge --update-env &&
              pm2 restart fastapi-backend --update-env &&
              echo DEPLOY_OK
            "

      - name: Verify PREFECT_JID on VM (Error #2)
        run: |
          gcloud compute ssh abami@whatsapp-bridge-vm \
            --zone=us-central1-a \
            --project=whatsapp-agent-507202 \
            --command="grep -q PREFECT_JID /home/abami/Whatsapp-Agent/.env && echo '✅ PREFECT_JID set' || (echo '❌ PREFECT_JID missing' && exit 1)"

      - name: Backend health check post-deploy (Error #3, #4)
        run: |
          sleep 15
          for i in {1..6}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://35.222.39.30:8080/health || echo "000")
            [ "$STATUS" = "200" ] && echo "✅ Backend healthy" && exit 0
            echo "Attempt $i/6: HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "❌ Backend not healthy after deploy" && exit 1

      - name: Queue backlog check (Error #8)
        run: |
          gcloud compute ssh abami@whatsapp-bridge-vm \
            --zone=us-central1-a \
            --project=whatsapp-agent-507202 \
            --command="
              COUNT=\$(wc -l < /home/abami/Whatsapp-Agent/bridge/queue.jsonl 2>/dev/null || echo 0)
              echo \"📦 Queue backlog: \$COUNT message(s)\"
              [ \"\$COUNT\" -lt 20 ] || echo '⚠️ High backlog — check if backend was slow during deploy'
            "

